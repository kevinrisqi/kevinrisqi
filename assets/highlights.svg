<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" fill="none" role="img" aria-label="Kevin Risqi — Highlights">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#102942"/>
      <stop offset="100%" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e2740"/>
      <stop offset="100%" stop-color="#0b1a2b"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#13B9FD"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .h    { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Courier New', ui-monospace, monospace; }
    .ico  { font-family: 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji', sans-serif; }
    .up   { opacity: 0; animation: up .8s ease-out forwards; }
    .c1{animation-delay:.05s} .c2{animation-delay:.18s} .c3{animation-delay:.31s} .c4{animation-delay:.44s}
    .a1{animation-delay:.60s} .a2{animation-delay:.72s} .a3{animation-delay:.84s}
    @keyframes up { from { opacity:0; transform: translateY(16px);} to { opacity:1; transform: translateY(0);} }
  </style>

  <!-- ============ STAT CARDS ============ -->
  <!-- Card 1: Repos -->
  <g class="up c1">
    <rect x="22"  y="20" width="246" height="120" rx="16" fill="url(#card)" stroke="#1f6fb2" stroke-opacity="0.45" filter="url(#soft)"/>
    <text class="ico" x="62"  y="86" font-size="38" text-anchor="middle">&#128230;</text>
    <text class="h"   x="108" y="74" font-size="34" font-weight="800" fill="url(#num)">87</text>
    <text class="h"   x="109" y="100" font-size="14" fill="#7fa6c4">Public Repos</text>
  </g>
  <!-- Card 2: Stars -->
  <g class="up c2">
    <rect x="292" y="20" width="246" height="120" rx="16" fill="url(#card)" stroke="#1f6fb2" stroke-opacity="0.45" filter="url(#soft)"/>
    <text class="ico" x="332" y="86" font-size="38" text-anchor="middle">&#11088;</text>
    <text class="h"   x="378" y="74" font-size="34" font-weight="800" fill="url(#num)">9</text>
    <text class="h"   x="379" y="100" font-size="14" fill="#7fa6c4">Stars Earned</text>
  </g>
  <!-- Card 3: Dart repos -->
  <g class="up c3">
    <rect x="562" y="20" width="246" height="120" rx="16" fill="url(#card)" stroke="#1f6fb2" stroke-opacity="0.45" filter="url(#soft)"/>
    <text class="ico" x="602" y="86" font-size="38" text-anchor="middle">&#128241;</text>
    <text class="h"   x="648" y="74" font-size="34" font-weight="800" fill="url(#num)">12</text>
    <text class="h"   x="649" y="100" font-size="14" fill="#7fa6c4">Flutter / Dart Repos</text>
  </g>
  <!-- Card 4: Member since -->
  <g class="up c4">
    <rect x="832" y="20" width="246" height="120" rx="16" fill="url(#card)" stroke="#1f6fb2" stroke-opacity="0.45" filter="url(#soft)"/>
    <text class="ico" x="872" y="86" font-size="38" text-anchor="middle">&#127881;</text>
    <text class="h"   x="918" y="74" font-size="34" font-weight="800" fill="url(#num)">2018</text>
    <text class="h"   x="919" y="100" font-size="14" fill="#7fa6c4">Member Since</text>
  </g>

  <!-- ============ ACHIEVEMENT PILLS ============ -->
  <text class="mono up a1" x="550" y="186" font-size="14" letter-spacing="3" fill="#6fb8e6" text-anchor="middle">&#9733; GITHUB ACHIEVEMENTS &#9733;</text>

  <g class="up a1">
    <rect x="31"  y="206" width="330" height="62" rx="14" fill="url(#pill)" stroke="#13B9FD" stroke-opacity="0.4"/>
    <text class="ico" x="70"  y="246" font-size="30" text-anchor="middle">&#129416;</text>
    <text class="h"   x="100" y="234" font-size="17" font-weight="700" fill="#e6f6ff">Pull Shark</text>
    <text class="h"   x="100" y="256" font-size="13" fill="#7fa6c4">Merged pull requests &#215;2</text>
  </g>
  <g class="up a2">
    <rect x="385" y="206" width="330" height="62" rx="14" fill="url(#pill)" stroke="#13B9FD" stroke-opacity="0.4"/>
    <text class="ico" x="424" y="246" font-size="30" text-anchor="middle">&#127956;</text>
    <text class="h"   x="454" y="234" font-size="17" font-weight="700" fill="#e6f6ff">Arctic Code Vault</text>
    <text class="h"   x="454" y="256" font-size="13" fill="#7fa6c4">Code preserved for 1,000 yrs</text>
  </g>
  <g class="up a3">
    <rect x="739" y="206" width="330" height="62" rx="14" fill="url(#pill)" stroke="#13B9FD" stroke-opacity="0.4"/>
    <text class="ico" x="778" y="246" font-size="30" text-anchor="middle">&#129309;</text>
    <text class="h"   x="808" y="234" font-size="17" font-weight="700" fill="#e6f6ff">Pair Extraordinaire</text>
    <text class="h"   x="808" y="256" font-size="13" fill="#7fa6c4">Co-authored commits</text>
  </g>
</svg>
